[package]
name = "eulesia-api"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
eulesia-common = { path = "../common" }
eulesia-auth = { path = "../auth" }
eulesia-db = { path = "../db" }
eulesia-search = { path = "../search" }
eulesia-ws = { path = "../ws" }
argon2 = { workspace = true }
axum = { workspace = true }
http-body-util = "0.1"
axum-extra = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
josekit = { workspace = true }
jsonwebtoken = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
hex = "0.4"
thiserror = { workspace = true }
image = "0.25"
webp = { workspace = true }
urlencoding = "2"
# SEO: server-side meta injection and sitemap generation.
# Runtime OG image rendering (resvg/usvg/tiny-skia/fontdb) is available when
# needed — add them back and implement seo::render_og_image.
quick-xml = "0.39"
lru = "0.16"
once_cell = "1"
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs", "eulesia-common/ts"]

[dev-dependencies]
axum-test = "17"
tokio = { workspace = true }
